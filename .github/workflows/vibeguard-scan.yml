name: VibeGuard Security Scan
description: "Run VibeGuard security engine on repositories"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  vibeguard-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install System Scanners (Trivy, Semgrep, Gitleaks, Checkov)
        run: |
          # Install Trivy
          wget https://github.com/aquasecurity/trivy/releases/download/v0.50.0/trivy_0.50.0_Linux-64bit.tar.gz
          tar zxvf trivy_0.50.0_Linux-64bit.tar.gz
          sudo mv trivy /usr/local/bin/
          
          # Install Semgrep
          python3 -m pip install semgrep
          
          # Install Gitleaks
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar zxvf gitleaks_8.18.2_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          
          # Install Checkov
          python3 -m pip install checkov

      - name: Install VibeGuard Dependencies
        run: npm ci

      - name: Build VibeGuard CLI
        run: npm run build --workspace=packages/cli

      - name: Run VibeGuard Scanner
        run: |
          echo "Running VibeGuard in CI Mode..."
          npx ts-node packages/cli/src/index.ts scan . --ci
        env:
          VIBEGUARD_API_URL: ${{ secrets.VIBEGUARD_API_URL }}
          VIBEGUARD_API_KEY: ${{ secrets.VIBEGUARD_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
